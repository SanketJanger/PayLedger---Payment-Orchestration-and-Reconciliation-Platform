services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger_local
      POSTGRES_DB: payledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U payledger -d payledger
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://payledger:payledger_local@db:5432/payledger
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  provider-db:
    image: postgres:17
    environment:
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: provider_local
      POSTGRES_DB: provider
    volumes:
      - provider_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U provider -d provider
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  provider:
    build:
      context: .
      dockerfile: Dockerfile.provider
    environment:
      DATABASE_URL: postgresql+psycopg://provider:provider_local@provider-db:5432/provider
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      provider-db:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal_data:/data
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres_data:
  provider_postgres_data:
  temporal_data:
